name: Verify and build production image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: docker/setup-buildx-action@v3
      - name: Build engine and production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: quake-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export image
        run: docker save quake-web:${{ github.sha }} | gzip > quake-image.tar.gz
      - name: Prepare verified original shareware data
        run: |
          sudo apt-get update
          sudo apt-get install -y lhasa unzip
          bash tools/setup-shareware.sh
      - name: Verify production game-server startup
        run: |
          docker run -d --name quake-smoke -p 3103:3000 \
            -e QUAKE_PUBLIC_ORIGIN=https://quake.example.com \
            -e QUAKE_MULTIPLAYER_URL=https://quake.example.com:4433/quake \
            -v "$PWD/deploy/game-data:/app/runtime/id1:ro" quake-web:${{ github.sha }}
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3103/healthz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3103/healthz
          node --input-type=module -e "const c=await(await fetch('http://127.0.0.1:3103/api/multiplayer')).json(); if(!c.available || !c.monsters || c.mode!=='coop' || c.map!=='e1m1' || c.url!=='https://quake.example.com:4433/quake')process.exit(1);"
          node --input-type=module -e "const c=await(await fetch('http://127.0.0.1:3103/api/multiplayer?mode=deathmatch')).json(); if(!c.available || c.monsters || c.mode!=='deathmatch' || c.map!=='e1m1' || c.fragLimit!==20 || c.timeLimit!==10 || c.maxPlayers!==8 || c.rooms.length!==2 || c.url!=='https://quake.example.com:4433/deathmatch')process.exit(1);"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3103/api/multiplayer/world)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3103/api/multiplayer/world?mode=deathmatch')" = 404
      - name: Container logs
        if: always()
        run: docker logs quake-smoke 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: quake-image
          path: quake-image.tar.gz
          retention-days: 14
